name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact_name: sable-linux-x86_64.tar.gz
            exe: sable
          - os: macos-latest
            target: darwin-arm64
            artifact_name: sable-darwin-arm64.tar.gz
            exe: sable
          - os: windows-latest
            target: windows-x86_64
            artifact_name: sable-windows-x86_64.zip
            exe: sable.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite3 ninja

      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure CMake
        run: |
          cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build SABLE
        run: |
          cmake --build cpp/build --config Release --target sable test_sable

      - name: Run Tests
        shell: bash
        run: |
          ./cpp/build/test_sable || ./cpp/build/Release/test_sable || ./cpp/build/test_sable.exe || ./cpp/build/Release/test_sable.exe

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp cpp/build/sable package/ || cp cpp/build/Release/sable package/
          tar -czvf ${{ matrix.artifact_name }} -C package sable
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          if (Test-Path cpp/build/sable.exe) { Copy-Item cpp/build/sable.exe package/ }
          elseif (Test-Path cpp/build/Release/sable.exe) { Copy-Item cpp/build/Release/sable.exe package/ }
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.artifact_name }}
          $hash = (Get-FileHash -Path ${{ matrix.artifact_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.sha256"

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
