[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-db"
version = "1.0.0"
description = "Self-optimizing adaptive database research engine"
requires-python = ">=3.10"

[project.scripts]
sable = "sable.cli:main"

[tool.setuptools.packages.find]
include = ["sable*"]
